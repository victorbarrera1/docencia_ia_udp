name: Supabase RLS

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  push:
    branches: [staging, main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"

jobs:
  rls:
    name: Esquema, migraciones y tests de RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Esquema + migraciones + tests de RLS (base desechable)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rls_test
        run: bash supabase/tests/run.sh
